name: CI/CD Monitoring

on:
  push:
    branches: [main, amira]
    paths:
      - 'Platforme_Test_Api/monitoring/**'
      - '.github/workflows/monitoring-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_PROMETHEUS: ${{ secrets.DOCKERHUB_USERNAME }}/bct-prometheus
  IMAGE_GRAFANA: ${{ secrets.DOCKERHUB_USERNAME }}/bct-grafana

jobs:
  docker-build-push:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amira') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push Prometheus
        uses: docker/build-push-action@v6
        with:
          context: Platforme_Test_Api/monitoring/prometheus
          push: true
          tags: ${{ env.IMAGE_PROMETHEUS }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build et push Grafana
        uses: docker/build-push-action@v6
        with:
          context: Platforme_Test_Api/monitoring/grafana
          push: true
          tags: ${{ env.IMAGE_GRAFANA }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Déploiement — exécuté sur le PC par le runner auto-hébergé
  deploy:
    needs: docker-build-push
    runs-on: self-hosted
    steps:
      - name: Déployer Prometheus et Grafana
        shell: cmd
        run: |
          docker network inspect app-net >NUL 2>&1 || docker network create app-net
          docker pull ${{ env.IMAGE_PROMETHEUS }}:latest || exit /b 1
          docker pull ${{ env.IMAGE_GRAFANA }}:latest || exit /b 1
          docker rm -f bct-prometheus >NUL 2>&1
          docker rm -f bct-grafana >NUL 2>&1
          docker run -d --name bct-prometheus --network app-net --restart unless-stopped -p 9090:9090 -v prometheus-data:/prometheus ${{ env.IMAGE_PROMETHEUS }}:latest || exit /b 1
          docker run -d --name bct-grafana --network app-net --restart unless-stopped -p 3000:3000 -v grafana-data:/var/lib/grafana ${{ env.IMAGE_GRAFANA }}:latest || exit /b 1
          docker image prune -f