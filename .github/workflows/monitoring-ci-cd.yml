name: CI/CD Monitoring

on:
  push:
    branches: [main, amira]
    paths:
      - 'Platforme_Test_Api/monitoring/**'
      - '.github/workflows/monitoring-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_PROMETHEUS: ${{ secrets.DOCKERHUB_USERNAME }}/bct-prometheus
  IMAGE_GRAFANA: ${{ secrets.DOCKERHUB_USERNAME }}/bct-grafana

jobs:
  docker-build-push:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amira') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push Prometheus
        uses: docker/build-push-action@v6
        with:
          context: Platforme_Test_Api/monitoring/prometheus
          push: true
          tags: ${{ env.IMAGE_PROMETHEUS }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build et push Grafana
        uses: docker/build-push-action@v6
        with:
          context: Platforme_Test_Api/monitoring/grafana
          push: true
          tags: ${{ env.IMAGE_GRAFANA }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            docker network inspect app-net >NUL 2>&1 || docker network create app-net
            docker pull ${{ env.IMAGE_PROMETHEUS }}:latest
            docker pull ${{ env.IMAGE_GRAFANA }}:latest
            docker stop bct-prometheus
            docker rm bct-prometheus
            docker stop bct-grafana
            docker rm bct-grafana
            docker run -d --name bct-prometheus --network app-net --restart unless-stopped -p 9090:9090 -v prometheus-data:/prometheus ${{ env.IMAGE_PROMETHEUS }}:latest
            docker run -d --name bct-grafana --network app-net --restart unless-stopped -p 3000:3000 -v grafana-data:/var/lib/grafana ${{ env.IMAGE_GRAFANA }}:latest
            docker image prune -f