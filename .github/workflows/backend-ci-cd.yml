name: CI/CD Backend

on:
  push:
    branches: [main, amira]
    paths:
      - 'Platforme_Test_Api/backend/back/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Platforme_Test_Api/backend/back/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bct-backend

jobs:
  # ============================================================
  # JOB 1 : Build + tests unitaires (CI)
  # ============================================================
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Platforme_Test_Api/backend/back
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build + tests unitaires
        # Tests unitaires isolés (mocks) : aucun accès à la base réelle n'est nécessaire.
        run: mvn -B clean verify

  # ============================================================
  # JOB 2 : Build & push de l'image Docker — main ET amira (phase de test)
  # ============================================================
  docker-build-push:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amira') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: Platforme_Test_Api/backend/back
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 : Déploiement — exécuté sur le PC par le runner auto-hébergé
  # (aucune connexion entrante : le runner va chercher la tâche lui-même)
  # ============================================================
  deploy:
    needs: docker-build-push
    runs-on: self-hosted
    steps:
      - name: Déployer le conteneur backend
        shell: cmd
        # Les secrets sont placés dans l'environnement de l'étape ; "docker run -e NOM"
        # (sans valeur) les transmet au conteneur sans les écrire dans la ligne de commande.
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          docker network inspect app-net >NUL 2>&1 || docker network create app-net
          docker pull ${{ env.IMAGE_NAME }}:latest || exit /b 1
          docker rm -f bct-backend >NUL 2>&1
          docker run -d --name bct-backend --network app-net --restart unless-stopped -p 8081:8081 ^
            -e SPRING_DATASOURCE_URL ^
            -e SPRING_DATASOURCE_USERNAME ^
            -e SPRING_DATASOURCE_PASSWORD ^
            -e JWT_SECRET ^
            -e JWT_EXPIRATION ^
            -e ADMIN_EMAIL ^
            -e ADMIN_PASSWORD ^
            -e MAIL_HOST ^
            -e MAIL_PORT ^
            -e MAIL_USERNAME ^
            -e MAIL_PASSWORD ^
            ${{ env.IMAGE_NAME }}:latest || exit /b 1
          docker image prune -f