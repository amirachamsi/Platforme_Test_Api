name: CI/CD Backend

on:
  push:
    branches: [main, amira]
    paths:
      - 'Platforme_Test_Api/backend/back/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Platforme_Test_Api/backend/back/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bct-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Platforme_Test_Api/backend/back
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build + tests unitaires
        run: mvn -B clean verify
        env:
          JWT_SECRET: test-secret-key-for-ci-only-not-used-in-prod
          JWT_EXPIRATION: 86400000
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

  # ============================================================
  # JOB 2 : Build & push de l'image Docker — main ET amira (phase de test)
  # (Phase 2 — pas encore de déploiement SSH, ça viendra en Phase 3)
  # ============================================================
  docker-build-push:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amira') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: Platforme_Test_Api/backend/back
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 : Déploiement sur le PC perso — via SSH (syntaxe cmd.exe Windows)
  # ============================================================
  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: >
            docker network create app-net &
            docker pull ${{ env.IMAGE_NAME }}:latest &
            docker stop bct-backend &
            docker rm bct-backend &
            docker run -d --name bct-backend --network app-net --restart unless-stopped -p 8081:8081 -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" -e JWT_SECRET="${{ secrets.JWT_SECRET }}" -e JWT_EXPIRATION="${{ secrets.JWT_EXPIRATION }}" -e MAIL_HOST="${{ secrets.MAIL_HOST }}" -e MAIL_PORT="${{ secrets.MAIL_PORT }}" -e MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" -e MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" ${{ env.IMAGE_NAME }}:latest &
            docker image prune -f