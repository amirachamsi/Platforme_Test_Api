name: CI/CD Backend

on:
  push:
    branches: [main, amira]
    paths:
      - 'backend/back/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/back/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bct-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/back
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build + tests unitaires
        run: mvn -B clean verify
        env:
          JWT_SECRET: test-secret-key-for-ci-only-not-used-in-prod
          JWT_EXPIRATION: 86400000
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

  # ============================================================
  # JOB 2 : Build & push de l'image Docker — main ET amira (phase de test)
  # (Phase 2 — pas encore de déploiement SSH, ça viendra en Phase 3)
  # ============================================================
  docker-build-push:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amira') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: backend/back
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 : Déploiement sur le PC perso — via SSH
  # ============================================================
  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DOCKERHUB_TOKEN,DOCKERHUB_USERNAME,IMAGE_NAME,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,JWT_EXPIRATION,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD
          script: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Création du réseau partagé si besoin..."
            docker network create app-net || true

            echo "Récupération de la nouvelle image..."
            docker pull $IMAGE_NAME:latest

            echo "Arrêt de l'ancien conteneur (si existant)..."
            docker stop bct-backend || true
            docker rm bct-backend || true

            echo "Démarrage du nouveau conteneur..."
            docker run -d \
              --name bct-backend \
              --network app-net \
              --restart unless-stopped \
              -p 8081:8081 \
              -e SPRING_DATASOURCE_URL="$DB_URL" \
              -e SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e JWT_EXPIRATION="$JWT_EXPIRATION" \
              -e MAIL_HOST="$MAIL_HOST" \
              -e MAIL_PORT="$MAIL_PORT" \
              -e MAIL_USERNAME="$MAIL_USERNAME" \
              -e MAIL_PASSWORD="$MAIL_PASSWORD" \
              $IMAGE_NAME:latest

            echo "Nettoyage des anciennes images..."
            docker image prune -f
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}ç